# StockBox — Render Blueprint
# Vertical slice: static web + Node paper-trading API

services:
  - type: web
    name: stockbox-web
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    envVars:
      - key: VITE_API_URL
        fromService:
          name: stockbox-api
          type: web
          property: host

  - type: web
    name: stockbox-api
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm run start:api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: TRADING_MODE
        value: PAPER
      - key: ENABLE_LIVE_TRADING
        value: "false"
      - key: ALPACA_API_KEY
        sync: false
      - key: ALPACA_SECRET_KEY
        sync: false
      - key: ALPACA_BASE_URL
        value: https://paper-api.alpaca.markets
      - key: OPENAI_API_KEY
        sync: false
