# StockBox — Render Blueprint
# One public free web service: Vite UI + paper-trading API (same origin).

services:
  - type: web
    name: stockbox
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start:api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: HOST
        value: 0.0.0.0
      - key: TRADING_MODE
        value: PAPER
      - key: ENABLE_LIVE_TRADING
        value: "false"
      - key: ALPACA_BASE_URL
        value: https://paper-api.alpaca.markets
      - key: ALPACA_API_KEY
        sync: false
      - key: ALPACA_SECRET_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
